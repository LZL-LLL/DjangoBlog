services:
  - type: web
    name: djangoblog
    runtime: python
    region: singapore
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DATABASE_URL
        fromDatabase:
          name: djangoblog-db
          property: connectionString
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: DJANGO_REDIS_URL
        sync: false
      - key: COMPRESS_ENABLED
        value: false

databases:
  - name: djangoblog-db
    region: singapore
    plan: free
    databaseName: djangoblog
